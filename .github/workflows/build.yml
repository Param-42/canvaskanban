# CanvasKanban build pipeline.
#
# On every push and pull request: build, test and create an application image on
# Windows and on Linux.
# On a version tag (v1.0.0 and similar): also build the Linux packages and attach
# them to a GitHub release.
#
# Native installers can only be built on their own operating system, which is why
# the Windows job builds the Windows package and the Linux job builds the Linux one.

name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only needed for the release job on a tag

jobs:
  test-and-package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Xvfb gives the build server a virtual screen, so the JavaFX user interface
      # tests really run instead of skipping themselves. If Xvfb is not available the
      # tests still pass, they just skip the 8 user interface tests.
      - name: Install a virtual screen (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb || true

      - name: Build with Maven (mvn clean package)
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a mvn -B --no-transfer-progress clean package
          else
            mvn -B --no-transfer-progress clean package
          fi

      - name: Run the tests (mvn test)
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a mvn -B --no-transfer-progress test
          else
            mvn -B --no-transfer-progress test
          fi

      - name: Build the application image (Linux)
        if: runner.os == 'Linux'
        run: ./package.sh app-image,tar

      - name: Build the application image (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: package.bat app-image

      - name: Upload the application image
        uses: actions/upload-artifact@v4
        with:
          name: CanvasKanban-${{ runner.os }}-app-image
          path: target/dist
          if-no-files-found: error

      - name: Upload the plain JAR
        uses: actions/upload-artifact@v4
        with:
          name: CanvasKanban-${{ runner.os }}-jar
          path: target/canvaskanban-*.jar
          if-no-files-found: error

  # RPM packages have to be built on a Fedora/RHEL machine. This job runs inside a
  # Fedora container, so it only runs for tags and for manual runs.
  rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Install the build tools
        run: |
          dnf install -y git findutils tar gzip which java-21-openjdk-devel maven rpm-build
          dnf install -y java-21-openjdk-jmods || echo "note: this Fedora has no separate jmods package"

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the RPM
        run: |
          # Work out JAVA_HOME from the java that the package manager installed.
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./package.sh rpm

      - name: Upload the RPM
        uses: actions/upload-artifact@v4
        with:
          name: CanvasKanban-linux-rpm
          path: target/dist/*.rpm
          if-no-files-found: error

  release:
    name: Attach the packages to the release
    runs-on: ubuntu-latest
    needs: [ test-and-package, rpm ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # The application image is a folder with hundreds of files, so it is zipped
      # before it is attached. The Linux one arrives as a .tar.gz already.
      - name: Zip the Windows application image
        run: |
          mkdir -p release
          cd dist/CanvasKanban-Windows-app-image
          zip -qr "$GITHUB_WORKSPACE/release/CanvasKanban-${GITHUB_REF_NAME#v}-windows-x64.zip" CanvasKanban

      - name: Collect the packages
        run: |
          cp dist/CanvasKanban-Linux-app-image/*.tar.gz release/ || true
          cp dist/CanvasKanban-linux-rpm/*.rpm release/ || true
          cp dist/CanvasKanban-Linux-jar/*.jar release/ || true
          ls -lh release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "CanvasKanban ${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*
