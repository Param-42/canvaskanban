# CanvasKanban build pipeline.
#
# On every push and pull request: build, test and create an application image on
# Windows and on Linux.
# On a version tag (v1.0.0 and similar): also build the Linux packages and attach
# them to a GitHub release.
#
# Native installers can only be built on their own operating system, which is why
# the Windows job builds the Windows package and the Linux job builds the Linux one.

name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only needed for the release job on a tag

jobs:
  test-and-package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Xvfb gives the build server a virtual screen, so the JavaFX user interface
      # tests really run instead of skipping themselves. If Xvfb is not available the
      # tests still pass, they just skip the 8 user interface tests.
      - name: Install a virtual screen (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb || true

      - name: Build with Maven (mvn clean package)
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a mvn -B --no-transfer-progress clean package
          else
            mvn -B --no-transfer-progress clean package
          fi

      - name: Run the tests (mvn test)
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a mvn -B --no-transfer-progress test
          else
            mvn -B --no-transfer-progress test
          fi

      - name: Build the application image (Linux)
        if: runner.os == 'Linux'
        run: ./package.sh app-image,tar

      - name: Build the application image (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: package.bat app-image

      - name: Upload the application image
        uses: actions/upload-artifact@v4
        with:
          name: CanvasKanban-${{ runner.os }}-app-image
          path: target/dist
          if-no-files-found: error

      - name: Upload the plain JAR
        uses: actions/upload-artifact@v4
        with:
          name: CanvasKanban-${{ runner.os }}-jar
          path: target/canvaskanban-*.jar
          if-no-files-found: error

  # RPM packages have to be built on a Fedora/RHEL machine. This job runs inside a
  # Fedora container, so it only runs for tags and for manual runs.
  #
  # The image is pinned on purpose: Fedora 44 (which "fedora:latest" points at now) has
  # dropped JDK 21, while Fedora 43 ships exactly the 21.0.12 that the rest of this
  # project is built with. The second dnf line falls back to a newer JDK if the image is
  # ever bumped.
  #
  # Careful with the JDK: Fedora's "maven" package pulls in the newest JDK (25 at the
  # moment) and points /usr/bin/java and /usr/bin/jpackage at it. That JDK is installed
  # without jmods, so jlink cannot build a runtime image with it ("No JDK Modules found").
  # The step below therefore picks the JDK 21 that this job installed and puts its bin
  # directory first on the PATH, so java, javac and jpackage all come from it.
  rpm:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:43
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Install the build tools
        run: |
          dnf install -y git findutils tar gzip maven rpm-build
          dnf install -y java-21-openjdk-devel java-21-openjdk-jmods \
            || dnf install -y java-25-openjdk-devel java-25-openjdk-jmods \
            || dnf install -y java-latest-openjdk-devel java-latest-openjdk-jmods

      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the RPM
        run: |
          for candidate in /usr/lib/jvm/java-21-openjdk /usr/lib/jvm/java-21-openjdk-* \
                           /usr/lib/jvm/jre-21-openjdk; do
            if [ -x "$candidate/bin/jpackage" ] && [ -d "$candidate/jmods" ]; then
              export JAVA_HOME="$candidate"
              break
            fi
          done

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "No JDK with jmods was found; jpackage needs them to build a runtime image."
            ls -d /usr/lib/jvm/*/ || true
            exit 1
          fi

          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          command -v java
          command -v jpackage
          java -version
          echo "jmods that jpackage needs: $(ls "$JAVA_HOME/jmods" | wc -l) files"
          ./package.sh rpm

      - name: Upload the RPM
        uses: actions/upload-artifact@v4
        with:
          name: CanvasKanban-linux-rpm
          path: target/dist/*.rpm
          if-no-files-found: error

  release:
    name: Attach the packages to the release
    runs-on: ubuntu-latest
    needs: [ test-and-package, rpm ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all the artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # The application image is a folder with hundreds of files, so it is zipped
      # before it is attached. The Linux one arrives as a .tar.gz already.
      - name: Zip the Windows application image
        run: |
          mkdir -p release
          cd dist/CanvasKanban-Windows-app-image
          zip -qr "$GITHUB_WORKSPACE/release/CanvasKanban-${GITHUB_REF_NAME#v}-windows-x64.zip" CanvasKanban

      - name: Collect the packages
        run: |
          cp dist/CanvasKanban-Linux-app-image/*.tar.gz release/ || true
          cp dist/CanvasKanban-linux-rpm/*.rpm release/ || true
          cp dist/CanvasKanban-Linux-jar/*.jar release/ || true
          ls -lh release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo is needed because this job does not check the code out, so gh cannot
          # work the repository out from a git remote. If the release already exists (a
          # tag that was pushed again, for example), the assets are replaced instead.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CanvasKanban ${GITHUB_REF_NAME}" \
            --generate-notes \
            release/* \
            || gh release upload "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --clobber \
                 release/*
